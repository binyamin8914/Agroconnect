name: CI/CD servicio-pedidos

# Integración continua en cada push o pull request; entrega continua a staging solo desde main.
on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/agroconnect-pedidos

jobs:
  # Etapa 1 y 2: integración del código, compilación y pruebas automatizadas
  build-and-test:
    name: 1. Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle con caché
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar, ejecutar pruebas y verificar Quality Gate
        # build = compilación + pruebas unitarias, de integración y de arquitectura (ArchUnit)
        #         + verificación de cobertura mínima 80 % (JaCoCo)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publicar resumen de pruebas
        if: always()
        run: python3 scripts/resumen_pruebas.py

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
            build/test-results/test

      - name: Guardar el artefacto compilado (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: servicio-pedidos-jar
          path: build/libs/servicio-pedidos.jar

  # Etapa 3: análisis de seguridad de dependencias (Quality Gate de seguridad)
  security-scan:
    name: 2. Análisis de seguridad
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: servicio-pedidos-jar
          path: artefacto

      - name: Escanear vulnerabilidades (Grype)
        uses: anchore/scan-action@v6
        with:
          path: artefacto
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  # Etapa 4: empaquetado en imagen Docker
  package:
    name: 3. Empaquetado Docker
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen (y publicarla si es main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest

  # Etapa 5: entrega continua a staging + prueba de humo
  deploy-staging:
    name: 4. Despliegue a staging y prueba de humo
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar el contenedor en el entorno staging
        run: |
          docker run -d --name pedidos-staging -p 8080:8080 ${{ env.IMAGEN }}:${{ github.sha }}

      - name: Esperar readiness (/actuator/health/readiness)
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health/readiness; then echo; echo "Servicio listo"; exit 0; fi
            sleep 2
          done
          docker logs pedidos-staging
          exit 1

      - name: Prueba de humo - registrar pedido (RF-04)
        run: |
          RESPUESTA=$(curl -fs -X POST http://localhost:8080/api/pedidos \
            -H 'Content-Type: application/json' \
            -d '{"idCliente":"C-001","items":[{"codigoProducto":"P-001","cantidad":2}],"modalidadDespacho":"ESTANDAR","transportista":"TRANSAGRO","direccionEntrega":"Talca"}')
          echo "$RESPUESTA"
          echo "$RESPUESTA" | grep -q '"estado":"DESPACHO_SOLICITADO"'
          {
            echo "## Prueba de humo en staging"
            echo ""
            echo "Imagen desplegada: \`${{ env.IMAGEN }}:${{ github.sha }}\`"
            echo ""
            echo '```json'
            echo "$RESPUESTA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detener el contenedor
        if: always()
        run: docker rm -f pedidos-staging
